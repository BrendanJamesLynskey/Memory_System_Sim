[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memsim"
version = "0.1.0"
description = "A command-level DRAM/HBM timing simulator: bank state machines, JEDEC-style timing constraints, address mapping, FCFS/FR-FCFS, refresh, and an independent protocol checker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "pytest-cov"]
fhe = ["fhe-sim @ git+https://github.com/BrendanJamesLynskey/FHE_Accelerator_Sim"]

[project.scripts]
memsim = "memsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
